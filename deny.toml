[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # fontdue currently depends on ttf-parser; this advisory reports maintenance status, not a vulnerability.
    "RUSTSEC-2026-0192",
    # Ratatui 0.29 (the first-party compatibility target) depends on archived paste; no safe upgrade exists.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
