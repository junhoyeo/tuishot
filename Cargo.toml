[workspace]
members = [
    "crates/ttyshot",
    "crates/ttyshot-core",
    "crates/ttyshot-ratatui",
    "crates/ttyshot-render",
    "crates/ttyshot-term",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/junhoyeo/ttyshot"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
