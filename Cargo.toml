[workspace]
members = [
    "crates/tuishot",
    "crates/tuishot-core",
    "crates/tuishot-ratatui",
    "crates/tuishot-render",
    "crates/tuishot-term",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/junhoyeo/tuishot"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
