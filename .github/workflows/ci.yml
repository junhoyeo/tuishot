name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Linux / stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Render synthetic scene example
        run: cargo run --locked -p tuishot -- run crates/tuishot/examples/synthetic.toml
      - name: Ratatui feature matrix
        run: |
          cargo test -p tuishot-ratatui --locked
          cargo test -p tuishot-ratatui --no-default-features --features ratatui-0-30 --locked
          cargo check -p tuishot-ratatui --no-default-features --locked

  deny:
    name: Linux / cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
