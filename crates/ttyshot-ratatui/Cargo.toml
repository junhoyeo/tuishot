[package]
name = "ttyshot-ratatui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Convert Ratatui buffers into deterministic ttyshot cell grids"

[lints]
workspace = true

[features]
default = ["ratatui-0-29"]
ratatui-0-29 = ["dep:ratatui-0-29", "dep:unicode-width"]
ratatui-0-30 = ["dep:ratatui-0-30"]

[dependencies]
ratatui-0-29 = { package = "ratatui", version = "0.29", default-features = false, features = ["underline-color"], optional = true }
ratatui-0-30 = { package = "ratatui", version = "0.30", default-features = false, features = ["underline-color"], optional = true }
serde_json = "1.0.145"
ttyshot-core = { path = "../ttyshot-core" }
ttyshot-render = { path = "../ttyshot-render" }
unicode-width = { version = "0.2.0", optional = true }
