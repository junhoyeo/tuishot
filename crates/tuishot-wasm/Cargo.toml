[package]
name = "tuishot-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Private wasm-bindgen bindings for the @tuishot/wasm package"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
# wasm-bindgen emits generated boundary glue containing unsafe code.
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
serde.workspace = true
serde_json = "1.0.145"
serde-wasm-bindgen = "0.6.5"
tuishot-ansi = { version = "0.1.0", path = "../tuishot-ansi", default-features = false, features = ["vte"] }
tuishot-core = { version = "0.1.0", path = "../tuishot-core" }
tuishot-render = { version = "0.1.0", path = "../tuishot-render" }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
sha2 = "0.10.9"
