[package]
name = "tuishot-ratatui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tuishot-ratatui"
description = "Convert Ratatui buffers into deterministic tuishot cell grids"
readme = "README.md"
keywords = ["ratatui", "tui", "terminal", "snapshot", "rendering"]
categories = ["gui", "rendering"]
include = ["src/**", "README.md", "LICENSE-MIT", "Cargo.toml"]

[lints]
workspace = true

[features]
default = ["ratatui-0-29"]
ratatui-0-29 = ["dep:ratatui-0-29", "dep:unicode-width"]
ratatui-0-30 = ["dep:ratatui-0-30"]

[dependencies]
ratatui-0-29 = { package = "ratatui", version = "0.29", default-features = false, features = ["underline-color"], optional = true }
ratatui-0-30 = { package = "ratatui", version = "0.30", default-features = false, features = ["underline-color"], optional = true }
serde_json = "1.0.145"
tuishot-core = { version = "0.1.0", path = "../tuishot-core" }
tuishot-render = { version = "0.1.0", path = "../tuishot-render" }
unicode-width = { version = "0.2.0", optional = true }
