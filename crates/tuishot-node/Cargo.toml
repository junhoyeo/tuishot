[package]
name = "tuishot-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Private napi-rs bindings for the @tuishot/node package"
publish = false

[lib]
crate-type = ["cdylib"]

[lints.rust]
# napi-derive emits registration glue that contains unsafe code.
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_json = "1.0.145"
tuishot-ansi = { version = "0.2.0", path = "../tuishot-ansi" }
tuishot-core = { version = "0.2.0", path = "../tuishot-core" }
tuishot-render = { version = "0.2.0", path = "../tuishot-render" }

[build-dependencies]
napi-build = "2"
