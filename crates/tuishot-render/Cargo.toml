[package]
name = "tuishot-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tuishot-render"
description = "Deterministic PNG and SVG renderer for tuishot terminal cell grids"
readme = "README.md"
keywords = ["terminal", "tui", "renderer", "screenshot", "svg"]
categories = ["rendering"]
include = ["src/**", "examples/**", "assets/JetBrainsMono-Regular.ttf", "assets/OFL-JetBrainsMono.txt", "assets/FONT-LICENSES.toml", "README.md", "LICENSE-MIT", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
ab_glyph_rasterizer = "0.1.8"
fontdue = "0.9.3"
png = "0.18.1"
ttf-parser = "0.25.1"
tuishot-core = { version = "0.2.0", path = "../tuishot-core" }

[dev-dependencies]
sha2 = "0.10.9"

