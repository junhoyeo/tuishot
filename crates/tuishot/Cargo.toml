[package]
name = "tuishot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Capture exact screenshots of terminal user interfaces"
readme = "README.md"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
regex = { version = "1.12.2", default-features = false, features = ["perf", "std", "unicode-perl"] }
serde.workspace = true
serde_json = "1.0.145"
toml = "0.9.8"
tuishot-core = { path = "../tuishot-core" }
tuishot-render = { path = "../tuishot-render" }
tuishot-term = { path = "../tuishot-term" }

[dev-dependencies]
tempfile = "3.23.0"
