[package]
name = "ttyshot-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic PNG and SVG renderer for ttyshot terminal cell grids"
readme = "README.md"
include = ["src/**", "assets/JetBrainsMono-Regular.ttf", "assets/OFL-JetBrainsMono.txt", "assets/FONT-LICENSES.toml", "README.md", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
ab_glyph_rasterizer = "0.1.8"
fontdue = "0.9.3"
png = "0.18.1"
ttf-parser = "0.25.1"
ttyshot-core = { path = "../ttyshot-core" }

[dev-dependencies]
sha2 = "0.10.9"

